name: Release APK

# Publishing a new version:
#   1. bump `version:` in pubspec.yaml
#   2. commit + push
#   3. git tag v1.0.1 && git push origin v1.0.1
# This workflow then builds a signed APK and attaches it to a GitHub Release.
# See RELEASING.md for the full runbook and the required secrets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Flutter dependencies
        run: flutter pub get

      - name: Verify signing config was applied
        run: |
          test -s android/app/upload-keystore.jks
          test -s android/key.properties

      - name: Analyze (non-blocking)
        # The project carries pre-existing analyzer infos/warnings, so this is a
        # report only — it must not block a release.
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/global-solar-2.0-${GITHUB_REF_NAME}.apk"

      - name: Verify expected APK
        run: |
          test -s "dist/global-solar-2.0-${GITHUB_REF_NAME}.apk"
          ls -lh dist

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/global-solar-2.0-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
